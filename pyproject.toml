[project]
name = "ivy-campus-connect-ai"
version = "1.0.0"
description = "IVY Campus Connect AI Flask application"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.3",
    "Flask-SocketIO==5.3.6",
    "requests==2.34.2",
    "groq",
    "psycopg2-binary",
    "supabase",
    "python-dotenv",
    "werkzeug",
    "gevent==26.9.0",
    "gevent-websocket",
    "gunicorn==21.2.0",
    "eventlet==0.41.2",
    "Pillow",
    "certifi",
]

[tool.vercel]
entrypoint = "CampusConnectAI.app:app"
